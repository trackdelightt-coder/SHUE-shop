<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>蘇蘇家具商店 - 後台管理</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>⚙️ 蘇蘇家具商店 後台管理</h1>
      <div class="sub">商品編輯 · 訂單查看</div>
    </div>
    <a class="admin-link" href="index.html">← 回買家頁面</a>
  </header>

  <div id="loginView" class="login-box">
    <h2>後台登入</h2>
    <input type="email" id="emailInput" placeholder="管理員 Email" autocomplete="username" />
    <input type="password" id="pwdInput" placeholder="密碼" autocomplete="current-password" />
    <button id="loginBtn">登入</button>
    <div id="loginMsg" style="color:#e0526b;font-size:13px;margin-top:8px;"></div>
  </div>

  <div id="adminView" class="admin-wrap" style="display:none;">
    <div class="tabs">
      <button id="tabItems" class="active">商品管理</button>
      <button id="tabSeries">幸運盒系列</button>
      <button id="tabOrders">訂單管理</button>
      <button id="tabSettings">商店設定</button>
      <button id="logoutBtn" style="margin-left:auto;">登出</button>
    </div>

    <div id="itemsPanel">
      <div class="form-grid" id="itemForm">
        <input type="hidden" id="itemId" />
        <div>
          <label>商品名稱</label>
          <input id="fName" placeholder="例：北歐風雙人沙發" />
        </div>
        <div>
          <label>分類（如需新增/刪除分類選項，請到下方「分類與標籤管理」）</label>
          <select id="fCategory"></select>
        </div>
        <div class="full">
          <label>標籤 Tag（勾選；如需新增/刪除標籤選項，請到下方「分類與標籤管理」）</label>
          <div id="fTagsPicker" class="tag-picker"></div>
        </div>
        <div>
          <label>所屬幸運盒系列</label>
          <select id="fSeries"><option value="">無系列／一般家具</option></select>
        </div>
        <div class="full">
          <label>商品標記（已售完不用勾，庫存歸零時前台會自動顯示已售完）</label>
          <div class="flag-row">
            <label><input type="checkbox" id="fIsNew" /> 🆕 新品(New)</label>
            <label><input type="checkbox" id="fGiftEligible" /> 🎁 可作為贈品</label>
          </div>
        </div>
        <div>
          <label>🍬 糖果價</label>
          <input id="fPriceCandy" type="number" placeholder="例：300" />
        </div>
        <div>
          <label>💵 現金價（NT$）</label>
          <input id="fPriceCash" type="number" placeholder="例：350" />
        </div>
        <div>
          <label>庫存</label>
          <input id="fStock" type="number" placeholder="例：20" />
        </div>
        <div class="full">
          <label>圖片網址（Google 雲端硬碟的話，只要把「你的檔案ID」換成你自己的那段文字就好）</label>
          <input id="fImage" placeholder="https://..." value="https://drive.google.com/thumbnail?id=你的檔案ID&sz=w1000" />
        </div>
        <div class="full">
          <label>商品描述</label>
          <textarea id="fDesc" rows="2"></textarea>
        </div>
        <button id="saveItemBtn" class="primary-submit">新增 / 儲存商品</button>
      </div>

      <div style="margin-bottom:12px;">
        <button id="seedBtn" class="secondary-btn" type="button">📦 匯入 6 筆範例商品（僅第一次使用時按一次）</button>
      </div>

      <div class="taxonomy-manage">
        <div class="taxonomy-col">
          <h3>🗂 分類管理</h3>
          <div id="categoryChipList" class="chip-list"></div>
          <div class="taxonomy-add-row">
            <input id="newCategoryInput" placeholder="新增分類名稱" />
            <button id="addCategoryBtn" class="secondary-btn" type="button">新增分類</button>
          </div>
        </div>
        <div class="taxonomy-col">
          <h3>🏷 標籤管理</h3>
          <div id="tagChipList" class="chip-list"></div>
          <div class="taxonomy-add-row">
            <input id="newTagInput" placeholder="新增標籤名稱" />
            <button id="addTagBtn" class="secondary-btn" type="button">新增標籤</button>
          </div>
        </div>
      </div>

      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px;">
        <input id="itemSearchBox" class="search-box" type="text" placeholder="🔍 搜尋商品名稱／系列名稱..." style="max-width:280px; margin-bottom:0;" />
        <select id="categoryFilter" style="max-width:180px;">
          <option value="">全部家具</option>
        </select>
        <select id="seriesFilterAdmin" style="max-width:200px;">
          <option value="">全部系列</option>
        </select>
      </div>

      <table>
        <thead>
          <tr><th>圖片</th><th>名稱</th><th>系列</th><th>分類</th><th>🍬 糖果價</th><th>💵 現金價</th><th>庫存</th><th>狀態</th><th>操作</th></tr>
        </thead>
        <tbody id="itemsTbody"></tbody>
      </table>
      <div class="pagination" id="itemsPagination"></div>
    </div>


    <div id="seriesPanel" style="display:none;">
      <div class="form-grid" id="seriesForm">
        <input type="hidden" id="seriesId" />
        <div>
          <label>系列名稱</label>
          <input id="sName" placeholder="例：夢幻樂園幸運盒" />
        </div>
        <div>
          <label>時間排序（1 = 最新，數字越大越舊）</label>
          <input id="sSortOrder" type="number" min="1" placeholder="例：1" />
        </div>
        <div class="full">
          <label>系列合輯大圖網址</label>
          <input id="sCoverImage" placeholder="https://..." />
        </div>
        <div class="full">
          <label>系列介紹（選填）</label>
          <textarea id="sDescription" rows="3"></textarea>
        </div>
        <button id="saveSeriesBtn" class="primary-submit">新增 / 儲存系列</button>
        <button id="clearSeriesBtn" class="secondary-btn" type="button">清空表單</button>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin:14px 0;">
        <button id="seedSeriesBtn" class="secondary-btn" type="button">🎁 建立 15 個預設幸運盒系列</button>
      </div>
      <div id="seriesAdminList" class="admin-series-list"></div>
    </div>

    <div id="ordersPanel" style="display:none;">
      <div class="order-stats" id="orderStats">
        <div class="order-stat-box">
          <div class="order-stat-label">🍬 已完成訂單・糖果總計</div>
          <div class="order-stat-value" id="statCandyTotal">0</div>
        </div>
        <div class="order-stat-box">
          <div class="order-stat-label">💵 已完成訂單・台幣總計</div>
          <div class="order-stat-value" id="statCashTotal">NT$ 0</div>
        </div>
      </div>
      <table>
        <thead>
          <tr><th>訂單編號</th><th>時間</th><th>買家</th><th>聯絡方式</th><th>角色</th><th>付款方式</th><th>明細</th><th>總金額</th><th>狀態</th><th>操作</th></tr>
        </thead>
        <tbody id="ordersTbody"></tbody>
      </table>
    </div>

    <div id="settingsPanel" style="display:none;">
      <div class="form-grid" style="grid-template-columns: 1fr;">
        <div>
          <label>商店公告（會顯示在買家頁面最上方，例如營業時間、交易比例、注意事項）</label>
          <textarea id="fAnnouncement" rows="6" placeholder="例：&#10;📢 營業時間：每天 20:00-24:00&#10;💰 交易方式：可糖可T，比值1:1&#10;💬 有問題歡迎 Discord 聯繫我們"></textarea>
        </div>
        <div class="flag-row" style="padding-bottom:4px;">
          <label><input type="checkbox" id="fGiftSectionEnabled" /> 🎁 開啟贈品專區（買家頁面會顯示「贈品專區」區塊，隨時可以關掉）</label>
        </div>
        <div class="flag-row" style="padding-bottom:4px;">
          <label><input type="checkbox" id="fGenderFemaleOnly" /> 🙍‍♀️ 僅限女角模式（開啟後買家頁面只能選女角，男角按鈕會隱藏，女角按鈕會顯示「限女角」）</label>
        </div>
        <div>
          <label>公告彈跳視窗（開啟後買家進站會跳出下方訊息；同一人看過就不會重複跳，除非妳改了內容）</label>
          <textarea id="fPopupMessage" rows="4" placeholder="輸入要跳出來的即時公告內容..."></textarea>
        </div>
        <div class="flag-row" style="padding-bottom:4px;">
          <label><input type="checkbox" id="fPopupEnabled" /> 📢 開啟公告彈跳視窗</label>
        </div>
        <button id="saveSettingsBtn" class="primary-submit">儲存設定</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
